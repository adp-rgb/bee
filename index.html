<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International Geography Bee Trainer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Main Container -->
  <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700 my-6">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-amber-400 mb-2">IGB Master Quiz 🌍</h1>
      <p class="text-slate-400 text-sm">Official Asian Championships 2017 - Round 1 Format</p>
    </div>

    <!-- Controls / Age Selection -->
    <div class="mb-6 bg-slate-700/50 p-4 rounded-xl border border-slate-600">
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Select Player Level / Age Tier:</label>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="setAgeTier('junior')" id="btn-junior" class="py-2 px-4 rounded-lg font-bold border-2 border-indigo-500 bg-indigo-600 text-white transition-all">
          Ages 9–11 (Junior)
        </button>
        <button onclick="setAgeTier('senior')" id="btn-senior" class="py-2 px-4 rounded-lg font-bold border-2 border-slate-600 bg-slate-800 text-slate-300 transition-all">
          Ages 12–15 (Pro / Varsity)
        </button>
      </div>
    </div>

    <!-- Quiz Area -->
    <div id="quiz-card" class="space-y-4">
      <div class="flex justify-between items-center text-xs text-slate-400 font-semibold">
        <span id="question-tracker">Question 1 of 5</span>
        <span id="score-tracker" class="text-amber-400 font-bold text-sm">Score: 0</span>
      </div>

      <!-- Question Text (Competition Length) -->
      <div class="bg-slate-900/80 p-5 rounded-xl border border-slate-700 min-h-[140px] flex flex-col justify-center">
        <h2 id="question-text" class="text-base font-normal text-slate-200 leading-relaxed">Loading Question...</h2>
      </div>

      <!-- Reading Source Excerpt Box -->
      <div id="source-box" class="hidden bg-amber-950/40 border border-amber-600/40 p-4 rounded-xl text-xs text-amber-200/90 leading-relaxed">
        <span class="font-bold text-amber-400 block mb-1">📖 Source Excerpt from Document:</span>
        <p id="source-text"></p>
      </div>

      <!-- Answer Options -->
      <div id="options-container" class="grid grid-cols-1 gap-3 pt-2">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- Result Area (Hidden by Default) -->
    <div id="result-card" class="hidden text-center py-8 space-y-4">
      <div class="text-5xl">🏆</div>
      <h2 class="text-2xl font-bold text-amber-400">Round Completed!</h2>
      <p id="final-score" class="text-slate-300 text-lg">You scored 0 points</p>
      <button onclick="restartQuiz()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-lg">
        Play Again
      </button>
    </div>

  </div>

  <script>
    // Quiz Database extracted directly from 2017-IGB-Round-1.pdf
    const quizData = {
      junior: [
        {
          question: "An annual 1,500-step stair challenge takes place in this city's 'Tower Eye.' This city's Royal Botanic Gardens and Port Jackson are overlooked by a bridge dubbed 'The Coathanger.' The Manly and Bondi Beaches serve this city, where Jorn Utzon designed a building whose roof invokes a series of sails. For the point, name this capital of New South Wales and site of a famous opera house, the most populous Australian city.",
          options: ["Melbourne", "Sydney", "Brisbane", "Perth"],
          answer: 1,
          source: "An annual 1,500-step stair challenge takes place in this city's 'Tower Eye.' This city's Royal Botanic Gardens and Port Jackson are overlooked by a bridge dubbed 'The Coathanger.' The Manly and Bondi Beaches serve this city, where Jorn Utzon designed a building whose roof invokes a series of sails. For the point, name this capital of New South Wales and site of a famous opera house, the most populous Australian city."
        },
        {
          question: "Immigrants from this country to Brazil introduced sfiha meat pies to South America. The Baalbeck International Festival is celebrated in this country, where the Phoenicians set up a trading post at its city of Tyre. Maronites make up over 20 percent of this country, where a Green Line in the capital divides Christian and Muslim communities. For the point, name this Middle Eastern country with capital at Beirut.",
          options: ["Lebanon", "Syria", "Jordan", "Egypt"],
          answer: 0,
          source: "Immigrants from this country to Brazil introduced sfiha meat pies to South America. The Baalbeck International Festival is celebrated in this country... Maronites make up over 20 percent of this country... For the point, name this Middle Eastern country with capital at Beirut."
        },
        {
          question: "This city's Georgian Quarter is home to its fashionable Merrion Square. An area of this city filled with tech companies is nicknamed Silicon Docks, near North Wall on the north banks of a river that flows under bridges named for Samuel Beckett and Sean O'Casey. The River Liffey flows through, for the point, what capital city of Ireland?",
          options: ["Belfast", "Dublin", "Cork", "Galway"],
          answer: 1,
          source: "This city's Georgian Quarter is home to its fashionable Merrion Square... Silicon Docks... The River Liffey flows through, for the point, what capital city of Ireland?"
        },
        {
          question: "It costs 50 kroner to be admitted onto one of these structures that was built in 1914 in Tivoli. One of these in Jackson, New Jersey that reaches 456 feet in height is known as Kingda Ka. Intamin is a designer of these structures, including Millennium Force at Cedar Point in Ohio. For the point, name these thrill rides that involve a train of cars on a wooden or steel track.",
          options: ["Ferris wheels", "Roller coasters", "Cable cars", "Funicular railways"],
          answer: 1,
          source: "It costs 50 kroner to be admitted onto one of these structures... Kingda Ka... Millennium Force at Cedar Point... For the point, name these thrill rides that involve a train of cars on a wooden or steel track."
        },
        {
          question: "A statue of this person at Cumbre Pass was erected to commemorate a 1904 peace deal between Chile and Argentina. A concrete and soapstone sculpture of this person atop Mount Corcovado is a popular tourist attraction that overlooks the city of Rio de Janeiro. For the point, name this figure, the subject of multiple 'Redeemer' statues.",
          options: ["Pope John Paul II", "Saint Francis", "Jesus Christ", "Simon Bolivar"],
          answer: 2,
          source: "A concrete and soapstone sculpture of this person atop Mount Corcovado is a popular tourist attraction that overlooks the city of Rio de Janeiro. For the point, name this figure, the subject of multiple 'Redeemer' statues..."
        }
      ],
      senior: [
        {
          question: "The Cimbri were a tribe thought to have been from this peninsula, inspiring an alternate name. This peninsula's most populous city, nicknamed the 'City of Smiles,' is Aarhus. Funen is found between this peninsula and the island of Zealand. A World War I battle fought off this peninsula saw the German navy defeated by the forces of John Jellicoe. For the point, name this peninsula shared by Germany and Denmark.",
          options: ["Iberian Peninsula", "Jutland Peninsula", "Scandinavian Peninsula", "Balkan Peninsula"],
          answer: 1,
          source: "The Cimbri were a tribe thought to have been from this peninsula... Aarhus... Funen is found between this peninsula and Zealand... For the point, name this peninsula shared by Germany and Denmark."
        },
        {
          question: "The second most common route to this peak's summit is the Polish Glacier route. After seven failed attempts, Edward FitzGerald became the first man to reach this mountain's summit. Nicknamed the 'Mountain of Death,' this peak is found in the province of Mendoza. The subduction of the Nazca plate formed this mountain, which is one of the seven summits. For the point, name this peak in the Andes, the tallest in South America.",
          options: ["Cotopaxi", "Aconcagua", "Mount Elbrus", "Chimborazo"],
          answer: 1,
          source: "The second most common route to this peak's summit is the Polish Glacier route... found in the province of Mendoza... For the point, name this peak in the Andes, the tallest in South America."
        },
        {
          question: "The Angsi Glacier is the source of this river, which flows through a protected area known for its rhinoceroses, Kaziranga National Park. In Sikkim, this river's basin is home to the mountain Kanchenjunga. This river's upper portion is known as the Yarlung Tsangpo in Tibet. This river joins the Padma in Bangladesh. For the point, name this river that flows through eastern India and China.",
          options: ["Mekong River", "Indus River", "Brahmaputra River", "Yellow River"],
          answer: 2,
          source: "The Angsi Glacier is the source... Kaziranga National Park... Yarlung Tsangpo in Tibet... joins the Padma... For the point, name this river that flows through eastern India and China."
        },
        {
          question: "This city is home to the Hector Pieterson Museum and the headquarters of the mobile telephone company Vodacom. Don Mattera wrote about his life among gangs in this country's suburb of Sophiatown. This city, found in the province of Gauteng, contains a campus of the University of Witwatersrand. Miners lived in this city's Soweto township. For the point, name this most populous city in South Africa.",
          options: ["Durban", "Pretoria", "Johannesburg", "Cape Town"],
          answer: 2,
          source: "Hector Pieterson Museum... Gauteng... University of Witwatersrand... Soweto township... For the point, name this city whose population... makes it the most populous city in South Africa."
        },
        {
          question: "A small number of these locations feature monuments dedicated to Radhabinod Pal, who controversially ruled that people mentioned in a Book of Souls at one of these locations were not guilty of war crimes. One of these locations in Mie Prefecture is torn down and rebuilt every twenty years; that structure in Ise includes two large torii gates. Hachiman and Amaterasu are among the kami worshiped at, for the point, what religious structures in Japan?",
          options: ["Shinto shrines", "Buddhist temples", "Torii gates", "Imperial palaces"],
          answer: 0,
          source: "One of these locations in Mie Prefecture is torn down and rebuilt every twenty years; that structure in Ise includes two large torii gates. Hachiman and Amaterasu are among the kami worshiped at, for the point, what religious structures in Japan?"
        }
      ]
    };

    let currentTier = 'junior';
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    function setAgeTier(tier) {
      currentTier = tier;
      document.getElementById('btn-junior').className = tier === 'junior' 
        ? "py-2 px-4 rounded-lg font-bold border-2 border-indigo-500 bg-indigo-600 text-white transition-all"
        : "py-2 px-4 rounded-lg font-bold border-2 border-slate-600 bg-slate-800 text-slate-300 transition-all";
      
      document.getElementById('btn-senior').className = tier === 'senior' 
        ? "py-2 px-4 rounded-lg font-bold border-2 border-indigo-500 bg-indigo-600 text-white transition-all"
        : "py-2 px-4 rounded-lg font-bold border-2 border-slate-600 bg-slate-800 text-slate-300 transition-all";

      restartQuiz();
    }

    function shuffleArray(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      currentQuestions = shuffleArray([...quizData[currentTier]]);
      document.getElementById('quiz-card').classList.remove('hidden');
      document.getElementById('result-card').classList.add('hidden');
      document.getElementById('score-tracker').innerText = `Score: ${score}`;
      loadQuestion();
    }

    function loadQuestion() {
      const q = currentQuestions[currentIndex];
      document.getElementById('question-tracker').innerText = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
      document.getElementById('question-text').innerText = q.question;
      
      // Reset Source Box
      document.getElementById('source-box').classList.add('hidden');
      document.getElementById('source-text').innerText = '';

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium py-3 px-4 rounded-xl border border-slate-600 transition-all active:scale-[0.98]";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
      });
    }

    function selectOption(index) {
      const q = currentQuestions[currentIndex];
      const buttons = document.getElementById('options-container').children;

      for (let btn of buttons) {
        btn.disabled = true;
      }

      if (index === q.answer) {
        buttons[index].className = "w-full text-left bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl border border-emerald-500";
        score += 10;
        document.getElementById('score-tracker').innerText = `Score: ${score}`;
      } else {
        buttons[index].className = "w-full text-left bg-rose-600 text-white font-bold py-3 px-4 rounded-xl border border-rose-500";
        buttons[q.answer].className = "w-full text-left bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl border border-emerald-500";
      }

      // Display the Reading Source Excerpt
      document.getElementById('source-text').innerText = q.source;
      document.getElementById('source-box').classList.remove('hidden');

      setTimeout(() => {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
          loadQuestion();
        } else {
          showResults();
        }
      }, 3500); // 3.5 seconds delay to allow reading the source reference
    }

    function showResults() {
      document.getElementById('quiz-card').classList.add('hidden');
      document.getElementById('result-card').classList.remove('hidden');
      document.getElementById('final-score').innerText = `You scored ${score} points!`;
      confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
    }

    // Initialize on load
    restartQuiz();
  </script>
</body>
</html>
