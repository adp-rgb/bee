<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Global Geography & Science Bee Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6 flex flex-col items-center">
  <div class="max-w-2xl w-full bg-slate-800 rounded-2xl p-6 border border-slate-700 my-auto shadow-2xl">
    <h1 class="text-2xl font-bold text-amber-400 mb-2">Academic Bee Trainer 🐝</h1>
    <p class="text-slate-400 text-xs mb-4">Auto-generated via AI Agent & GitHub Actions</p>

    <div id="quiz-container" class="space-y-4">
      <div class="text-xs font-semibold text-indigo-400 uppercase tracking-wider" id="category">Loading...</div>
      <div class="bg-slate-900 p-4 rounded-xl text-sm leading-relaxed" id="question">Fetching latest quiz pack...</div>
      <div id="options" class="grid grid-cols-1 gap-2 pt-2"></div>
      <div id="explanation" class="hidden bg-emerald-950/60 border border-emerald-600/40 p-3 rounded-lg text-xs text-emerald-200"></div>
    </div>
  </div>

  <script>
    let quizzes = [];
    let currentIdx = 0;

    async function loadQuizzes() {
      const res = await fetch('./quizzes.json');
      quizzes = await res.json();
      renderQuestion();
    }

    function renderQuestion() {
      const q = quizzes[currentIdx];
      document.getElementById('category').innerText = `[${currentIdx + 1}/${quizzes.length}] ${q.category}`;
      document.getElementById('question').innerText = q.question;
      document.getElementById('explanation').classList.add('hidden');

      const optsContainer = document.getElementById('options');
      optsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left bg-slate-700 hover:bg-slate-600 p-3 rounded-xl text-xs font-medium border border-slate-600 transition-all";
        btn.innerText = opt;
        btn.onclick = () => {
          if (idx === q.answer) {
            btn.className = "w-full text-left bg-emerald-600 text-white p-3 rounded-xl text-xs font-bold";
          } else {
            btn.className = "w-full text-left bg-rose-600 text-white p-3 rounded-xl text-xs font-bold";
          }
          document.getElementById('explanation').innerText = `Explanation: ${q.explanation}`;
          document.getElementById('explanation').classList.remove('hidden');
        };
        optsContainer.appendChild(btn);
      });
    }

    loadQuizzes();
  </script>
</body>
</html>
