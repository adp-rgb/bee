<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI IAC Geography Bee Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- PDF.js library for in-browser PDF parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700 my-6">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-amber-400 mb-1">AI Geography Bee Generator 🐝</h1>
      <p class="text-slate-400 text-xs">Upload any PDF to auto-generate official IAC-style quizzes</p>
    </div>

    <!-- API Key Input & PDF Upload Panel -->
    <div class="mb-6 bg-slate-700/50 p-4 rounded-xl border border-slate-600 space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Gemini API Key (Free):</label>
        <input type="password" id="api-key" placeholder="Paste your AI Studio API key here" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-amber-300 focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Upload Geography PDF Document:</label>
        <input type="file" id="pdf-file" accept="application/pdf" onchange="generateQuizFromPDF()" class="w-full text-xs text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
      </div>
    </div>

    <!-- Status Message -->
    <div id="status-box" class="hidden text-center py-3 px-4 mb-4 rounded-xl text-sm font-semibold bg-indigo-900/60 border border-indigo-500 text-indigo-200">
      <span id="status-text">Processing PDF...</span>
    </div>

    <!-- Quiz Area -->
    <div id="quiz-card" class="space-y-4">
      <div class="flex justify-between items-center text-xs font-bold bg-slate-900/60 p-3 rounded-lg border border-slate-700">
        <span id="question-tracker" class="text-slate-300">Question: 1 / 0</span>
        <span id="correct-tracker" class="text-indigo-400">Correct: 0 / 6</span>
        <span id="score-tracker" class="text-amber-400 text-sm">Score: 0 pts</span>
      </div>

      <div class="bg-slate-900/80 p-5 rounded-xl border border-slate-700 min-h-[140px] flex flex-col justify-center relative">
        <h2 id="question-text" class="text-base font-normal text-slate-200 leading-relaxed">Upload a PDF file above to generate your first AI geography bee quiz!</h2>
      </div>

      <div id="options-container" class="grid grid-cols-1 gap-3 pt-1"></div>
    </div>

  </div>

  <script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let quizData = [];
    let currentIndex = 0;
    let correctCount = 0;
    let rawScore = 0;

    // 1. Extract text from uploaded PDF
    async function generateQuizFromPDF() {
      const apiKey = document.getElementById('api-key').value.trim();
      const fileInput = document.getElementById('pdf-file');
      const statusBox = document.getElementById('status-box');
      const statusText = document.getElementById('status-text');

      if (!apiKey) {
        alert("Please enter your free Gemini API key first!");
        return;
      }
      if (!fileInput.files.length) return;

      statusBox.classList.remove('hidden');
      statusText.innerText = "📄 Extracting text from PDF...";

      try {
        const file = fileInput.files[0];
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let extractedText = "";

        for (let i = 1; i <= Math.min(pdf.numPages, 5); i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          extractedText += content.items.map(item => item.str).join(" ") + "\n";
        }

        statusText.innerText = "🤖 AI Agent is generating pyramidal IAC questions...";
        await callGeminiAI(extractedText, apiKey);

      } catch (err) {
        statusText.innerText = "❌ Error processing PDF or API call failed.";
        console.error(err);
      }
    }

    // 2. Call Gemini API to generate structured quiz JSON
    async function callGeminiAI(pdfText, apiKey) {
      const prompt = `
You are an official International Academic Competitions (IAC) Geography Bee quiz writer.
Analyze the following text and generate 6 pyramidal tossup questions in JSON format.

RULES FOR QUESTIONS:
1. Each question MUST be 50-70 words long (3 sentences).
2. Sentence 1: Hard/obscure clue. Sentence 2: Medium clue. Sentence 3: "For the point, name..." easy clue.
3. Provide 4 answer choices where 1 is correct and 3 are plausible distractors.

OUTPUT JSON FORMAT ONLY:
[
  {
    "question": "Full question text...",
    "options": ["Option A", "Option B", "Option C", "Option D"],
    "answer": 0,
    "source": "Excerpt from PDF text used"
  }
]

SOURCE TEXT:
${pdfText.substring(0, 4000)}
`;

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      const data = await response.json();
      const rawJson = data.candidates[0].content.parts[0].text;
      
      quizData = JSON.parse(rawJson);
      document.getElementById('status-box').classList.add('hidden');
      
      restartQuiz();
    }

    function restartQuiz() {
      currentIndex = 0;
      correctCount = 0;
      rawScore = 0;
      if (quizData.length === 0) return;
      loadQuestion();
    }

    function loadQuestion() {
      const q = quizData[currentIndex];
      document.getElementById('question-tracker').innerText = `Question: ${currentIndex + 1} /${quizData.length}`;
      document.getElementById('question-text').innerText = q.question;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium py-3 px-4 rounded-xl border border-slate-600 transition-all";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
      });
    }

    function selectOption(index) {
      const q = quizData[currentIndex];
      if (index === q.answer) {
        rawScore += 1;
        correctCount++;
      }
      currentIndex++;
      if (currentIndex < quizData.length) {
        loadQuestion();
      } else {
        document.getElementById('question-text').innerText = `🎉 Quiz Finished! Final Score: ${rawScore} /${quizData.length} pts`;
        document.getElementById('options-container').innerHTML = '';
        confetti({ particleCount: 100, spread: 70 });
      }
    }
  </script>
</body>
</html>
