<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Bee Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Top Navigation Header -->
  <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-amber-500 text-slate-950 font-black p-2 rounded-xl text-lg shadow-lg shadow-amber-500/20">🐝</div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-slate-100 leading-tight">Academic Bee Trainer</h1>
          <p class="text-[10px] text-amber-400 font-medium">12,000+ Pyramidal Clues Engine</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs bg-slate-800 border border-slate-700 text-slate-300 px-3 py-1.5 rounded-full font-semibold">
          Middle School
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-1 space-y-6">

    <!-- Performance Dashboard Section -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center gap-4">
        <div class="bg-indigo-500/10 text-indigo-400 p-3 rounded-xl border border-indigo-500/20 font-bold text-xl">📝</div>
        <div>
          <p class="text-xs text-slate-400 uppercase tracking-wider font-medium">Attempted</p>
          <p id="stat-attempted" class="text-2xl font-bold text-slate-100">0</p>
        </div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center gap-4">
        <div class="bg-emerald-500/10 text-emerald-400 p-3 rounded-xl border border-emerald-500/20 font-bold text-xl">🎯</div>
        <div>
          <p class="text-xs text-slate-400 uppercase tracking-wider font-medium">Accuracy</p>
          <p id="stat-accuracy" class="text-2xl font-bold text-slate-100">0%</p>
        </div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center gap-4">
        <div class="bg-amber-500/10 text-amber-400 p-3 rounded-xl border border-amber-500/20 font-bold text-xl">🏆</div>
        <div>
          <p class="text-xs text-slate-400 uppercase tracking-wider font-medium">Rank Status</p>
          <p class="text-2xl font-bold text-amber-400">Novice</p>
        </div>
      </div>
    </section>

    <!-- QuizVidya-Style Category Dashboard -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800 pb-3">
        <div>
          <h2 class="text-lg font-bold text-slate-100">Science & Geography Bee Prep</h2>
          <p class="text-xs text-slate-400">Select a study mode or begin full tossup rounds.</p>
        </div>
        
        <!-- Dropdown Question Jumper -->
        <div class="flex items-center gap-2">
          <label for="question-select" class="text-xs text-slate-400">Jump To:</label>
          <select id="question-select" onchange="jumpToQuestion(this.value)" class="bg-slate-800 text-xs text-amber-400 font-bold px-3 py-1.5 rounded-xl border border-slate-700 outline-none cursor-pointer">
          </select>
        </div>
      </div>

      <!-- Module Action Grid (Cleaned-Up Alternative Labels) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
        <button onclick="filterMode('all')" class="flex items-center justify-between bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 p-3 rounded-xl text-xs font-semibold transition-all">
          <span>🏆 Full Tossup Round</span>
          <span>→</span>
        </button>

        <button onclick="toggleFlashcards()" class="flex items-center justify-between bg-indigo-500/10 hover:bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 p-3 rounded-xl text-xs font-semibold transition-all">
          <span>🎴 Active Recall Deck</span>
          <span>→</span>
        </button>

        <button onclick="filterMode('Geography')" class="flex items-center justify-between bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-300 p-3 rounded-xl text-xs font-semibold transition-all">
          <span>🌍 Geography Drill</span>
          <span>→</span>
        </button>

        <button onclick="filterMode('Science')" class="flex items-center justify-between bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 p-3 rounded-xl text-xs font-semibold transition-all">
          <span>🧪 Science Drill</span>
          <span>→</span>
        </button>
      </div>
    </section>

    <!-- Main Quiz Interface -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-2xl space-y-4">
      
      <!-- Quiz Header -->
      <div class="flex items-center justify-between">
        <span id="category" class="text-xs font-bold text-amber-400 uppercase tracking-widest bg-amber-400/10 border border-amber-400/20 px-3 py-1 rounded-full">
          Loading Category...
        </span>
        <span id="quiz-progress" class="text-xs font-semibold text-slate-400 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
          0/0
        </span>
      </div>

      <!-- Question Text Box -->
      <div id="question" class="bg-slate-950 p-4 sm:p-5 rounded-xl text-sm sm:text-base leading-relaxed border border-slate-800 text-slate-200 min-h-[100px] flex items-center">
        Fetching latest quiz pack...
      </div>

      <!-- Option Buttons Container -->
      <div id="options" class="grid grid-cols-1 gap-2.5 pt-1"></div>

      <!-- Explanation Box -->
      <div id="explanation" class="hidden bg-emerald-950/60 border border-emerald-600/40 p-4 rounded-xl text-xs sm:text-sm text-emerald-200 leading-relaxed"></div>

      <!-- Navigation Bar -->
      <div class="flex items-center justify-between gap-3 pt-4 border-t border-slate-800">
        <button id="prev-btn" onclick="prevQuestion()" disabled 
          class="flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 disabled:opacity-30 disabled:pointer-events-none transition-all border border-slate-700">
          ← Previous
        </button>

        <button id="next-btn" onclick="nextQuestion()" disabled 
          class="flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 active:scale-95 disabled:opacity-30 disabled:pointer-events-none transition-all shadow-lg shadow-amber-500/10">
          Next →
        </button>
      </div>
    </section>

  </main>

  <script>
    let rawQuizzes = [];
    let quizzes = [];
    let currentIdx = 0;
    let attemptedCount = 0;
    let correctCount = 0;

    async function loadQuizzes() {
      try {
        const res = await fetch('./quizzes.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        
        rawQuizzes = Array.isArray(data) ? data : (data.quizzes || []);
        quizzes = [...rawQuizzes];

        if (quizzes.length > 0) {
          renderQuestion();
        } else {
          document.getElementById('question').innerText = 'No questions available in quizzes.json.';
        }
      } catch (err) {
        console.error('Error fetching quiz data:', err);
        document.getElementById('question').innerText = 'Failed to load quizzes.json. Check GitHub Pages setup.';
      }
    }

    function updateQuestionSelector() {
      const select = document.getElementById('question-select');
      if (!select) return;
      select.innerHTML = quizzes.map((_, i) => 
        `<option value="${i}" ${i === currentIdx ? 'selected' : ''}>Q${i + 1}</option>`
      ).join('');
    }

    function renderQuestion() {
      if (quizzes.length === 0) return;
      const q = quizzes[currentIdx];
      
      updateQuestionSelector();

      document.getElementById('category').innerText = q.category || 'General Knowledge';
      document.getElementById('quiz-progress').innerText = `${currentIdx + 1}/${quizzes.length}`;
      document.getElementById('question').innerText = q.question;
      
      const explanationEl = document.getElementById('explanation');
      explanationEl.classList.add('hidden');
      explanationEl.innerText = '';

      const optsContainer = document.getElementById('options');
      optsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left bg-slate-800 hover:bg-slate-700 active:bg-slate-600 p-3.5 sm:p-4 rounded-xl text-xs sm:text-sm font-medium border border-slate-700 text-slate-200 transition-all";
        btn.innerText = opt;
        
        btn.onclick = () => {
          const allBtns = optsContainer.querySelectorAll('button');
          allBtns.forEach(b => b.disabled = true);

          attemptedCount++;
          if (idx === q.answer) {
            correctCount++;
            btn.className = "w-full text-left bg-emerald-600 text-white p-3.5 sm:p-4 rounded-xl text-xs sm:text-sm font-bold shadow-lg shadow-emerald-900/40";
          } else {
            btn.className = "w-full text-left bg-rose-600 text-white p-3.5 sm:p-4 rounded-xl text-xs sm:text-sm font-bold shadow-lg shadow-rose-900/40";
            if (allBtns[q.answer]) {
              allBtns[q.answer].className = "w-full text-left bg-emerald-700 text-white p-3.5 sm:p-4 rounded-xl text-xs sm:text-sm font-bold border border-emerald-500";
            }
          }
          
          updateDashboardStats();
          explanationEl.innerText = `Explanation: ${q.explanation}`;
          explanationEl.classList.remove('hidden');
        };
        
        optsContainer.appendChild(btn);
      });

      document.getElementById('prev-btn').disabled = currentIdx === 0;
      document.getElementById('next-btn').disabled = currentIdx === quizzes.length - 1;
    }

    function updateDashboardStats() {
      document.getElementById('stat-attempted').innerText = attemptedCount;
      const accuracy = attemptedCount > 0 ? Math.round((correctCount / attemptedCount) * 100) : 0;
      document.getElementById('stat-accuracy').innerText = `${accuracy}%`;
    }

    function prevQuestion() {
      if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentIdx < quizzes.length - 1) {
        currentIdx++;
        renderQuestion();
      }
    }

    function jumpToQuestion(idx) {
      currentIdx = parseInt(idx, 10);
      renderQuestion();
    }

    function filterMode(catKey) {
      if (catKey === 'all') {
        quizzes = [...rawQuizzes];
      } else {
        quizzes = rawQuizzes.filter(q => q.category.toLowerCase().includes(catKey.toLowerCase()));
      }
      currentIdx = 0;
      if (quizzes.length > 0) {
        renderQuestion();
      } else {
        document.getElementById('question').innerText = `No questions found for ${catKey}.`;
        document.getElementById('options').innerHTML = '';
      }
    }

    function toggleFlashcards() {
      alert("Flashcard Mode: Questions act as active recall cards. Simply read the question and select an option to check your memory!");
    }

    loadQuizzes();
  </script>
</body>
</html>
