<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Bee Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-4 sm:p-6">

  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Header -->
    <header class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg">
      <div>
        <h1 class="text-2xl font-bold text-amber-400">Academic Bee Prep Hub 🐝</h1>
        <p class="text-xs text-slate-400">Select a discipline and practice mode to start</p>
      </div>
      <div id="overall-score" class="text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-full">
        Score: 0 pts
      </div>
    </header>

    <!-- Accordion 1: Science Bee -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-md">
      <div onclick="toggleAccordion('science-content', 'science-icon')" class="flex justify-between items-center p-5 cursor-pointer hover:bg-slate-750 transition-colors">
        <div>
          <h2 class="text-xl font-bold text-cyan-400">Science & Earth Systems</h2>
          <p class="text-xs text-slate-400">Middle School Division</p>
        </div>
        <span id="science-icon" class="text-slate-400 transform transition-transform duration-200">▼</span>
      </div>

      <div id="science-content" class="p-5 border-t border-slate-700 bg-slate-850 space-y-3">
        <!-- Main Launch Button -->
        <button onclick="launchMode('Science', 'all')" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 px-4 rounded-xl text-sm transition-all shadow-md">
          ⚡ Full Preliminary Round (30 Questions)
        </button>

        <!-- Secondary Action Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button onclick="launchMode('Science', 'high-frequency')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-xl text-left border border-slate-600">
            <div class="text-amber-400 font-bold text-xs">🔥 High-Frequency Concepts</div>
            <div class="text-slate-400 text-xs">Practice recurring tournament clues</div>
          </button>

          <button onclick="launchMode('Science', 'flashcards')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-xl text-left border border-slate-600">
            <div class="text-emerald-400 font-bold text-xs">🎴 Flashcard Review</div>
            <div class="text-slate-400 text-xs">Self-paced rapid recall</div>
          </button>
        </div>
      </div>
    </div>

    <!-- Accordion 2: Geography Bee -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-md">
      <div onclick="toggleAccordion('geo-content', 'geo-icon')" class="flex justify-between items-center p-5 cursor-pointer hover:bg-slate-750 transition-colors">
        <div>
          <h2 class="text-xl font-bold text-emerald-400">World & Physical Geography</h2>
          <p class="text-xs text-slate-400">Middle School Division</p>
        </div>
        <span id="geo-icon" class="text-slate-400 transform transition-transform duration-200">▼</span>
      </div>

      <div id="geo-content" class="p-5 border-t border-slate-700 bg-slate-850 space-y-3">
        <!-- Main Launch Button -->
        <button onclick="launchMode('Geography', 'all')" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 px-4 rounded-xl text-sm transition-all shadow-md">
          ⚡ Full Preliminary Round (30 Questions)
        </button>

        <!-- Secondary Action Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button onclick="launchMode('Geography', 'high-frequency')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-xl text-left border border-slate-600">
            <div class="text-amber-400 font-bold text-xs">🔥 High-Frequency Concepts</div>
            <div class="text-slate-400 text-xs">Focus on high-yield clues</div>
          </button>

          <button onclick="launchMode('Geography', 'flashcards')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-xl text-left border border-slate-600">
            <div class="text-cyan-400 font-bold text-xs">🎴 Flashcard Review</div>
            <div class="text-slate-400 text-xs">Self-paced rapid recall</div>
          </button>
        </div>
      </div>
    </div>

    <!-- Quiz Display Modal / Container -->
    <div id="quiz-container" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl relative">
      <div class="flex justify-between items-center mb-4">
        <span id="active-mode-tag" class="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-full"></span>
        <div class="flex items-center gap-2">
          <select id="question-select" onchange="jumpToQuestion(this.value)" class="bg-slate-700 text-xs text-amber-400 font-bold px-2 py-1 rounded border border-slate-600 outline-none">
          </select>
          <span id="quiz-progress" class="text-xs font-bold text-slate-400">0/0</span>
          <button onclick="closeQuiz()" class="text-slate-400 hover:text-white text-xs px-2">✕ Close</button>
        </div>
      </div>

      <div id="question-category" class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-2"></div>
      <div id="question-body" class="text-sm sm:text-base leading-relaxed mb-6"></div>

      <!-- Multiple Choice Options -->
      <div id="options-grid" class="space-y-2 mb-4"></div>

      <!-- Flashcard Reveal Button (Only visible in Flashcard mode) -->
      <button id="flashcard-reveal-btn" onclick="revealFlashcard()" class="hidden w-full bg-amber-600 hover:bg-amber-500 font-bold py-3 rounded-xl text-sm transition-all mb-4">
        👁️ Reveal Answer & Explanation
      </button>

      <!-- Explanation Box -->
      <div id="explanation-box" class="hidden bg-slate-900/80 border border-slate-700 p-4 rounded-xl text-xs sm:text-sm text-slate-300 mb-4"></div>

      <!-- Nav Control -->
      <div class="flex justify-between pt-2">
        <button id="prev-btn" onclick="navQuestion(-1)" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-bold">← Previous</button>
        <button id="next-btn" onclick="navQuestion(1)" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold">Next →</button>
      </div>
    </div>

  </div>

  <script>
    let allData = [];
    let activeSet = [];
    let currentIdx = 0;
    let isFlashcardMode = false;
    let totalScore = parseInt(localStorage.getItem('bee_score') || '0', 10);

    document.getElementById('overall-score').innerText = `Score: ${totalScore} pts`;

    // Load Quizzes from JSON
    async function init() {
      try {
        const res = await fetch('./quizzes.json');
        if (!res.ok) throw new Error('Failed to load quizzes.json');
        const data = await res.json();
        allData = Array.isArray(data) ? data : (data.quizzes || []);
      } catch (err) {
        console.error(err);
      }
    }
    init();

    // Accordion Toggle
    function toggleAccordion(contentId, iconId) {
      const content = document.getElementById(contentId);
      const icon = document.getElementById(iconId);
      content.classList.toggle('hidden');
      icon.style.transform = content.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
    }

// Launch Mode Handler
    function launchMode(subject, mode) {
      if (allData.length === 0) {
        alert("Quiz data is loading or missing.");
        return;
      }

      isFlashcardMode = (mode === 'flashcards');
      
      // Filter questions by subject/mode
      activeSet = allData.filter(q => {
        const matchSub = q.category.toLowerCase().includes(subject.toLowerCase());
        if (mode === 'high-frequency') {
          return matchSub && (q.id % 2 === 0);
        }
        return matchSub; // Corrected: Returns true only when category matches
      });

      if (activeSet.length === 0) activeSet = allData;

      currentIdx = 0;
      document.getElementById('quiz-container').classList.remove('hidden');
      document.getElementById('active-mode-tag').innerText = `${subject.toUpperCase()} • ${mode.toUpperCase()}`;
      
      renderCurrentQuestion();
      document.getElementById('quiz-container').scrollIntoView({ behavior: 'smooth' });
    }

    // Render Question / Flashcard
    function renderCurrentQuestion() {
      const q = activeSet[currentIdx];
      
      // Sync Dropdown & Progress
      const select = document.getElementById('question-select');
      select.innerHTML = activeSet.map((_, i) => `<option value="${i}" ${i === currentIdx ? 'selected' : ''}>Q${i + 1}</option>`).join('');
      document.getElementById('quiz-progress').innerText = `${currentIdx + 1}/${activeSet.length}`;

      document.getElementById('question-category').innerText = q.category;
      document.getElementById('question-body').innerText = q.question;
      
      const optsContainer = document.getElementById('options-grid');
      const revealBtn = document.getElementById('flashcard-reveal-btn');
      const expBox = document.getElementById('explanation-box');
      
      expBox.classList.add('hidden');
      expBox.innerText = '';
      optsContainer.innerHTML = '';

      if (isFlashcardMode) {
        optsContainer.classList.add('hidden');
        revealBtn.classList.remove('hidden');
      } else {
        optsContainer.classList.remove('hidden');
        revealBtn.classList.add('hidden');

        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = "w-full text-left bg-slate-700 hover:bg-slate-600 p-3.5 rounded-xl text-xs sm:text-sm font-medium border border-slate-600 transition-all";
          btn.innerText = opt;
          
          btn.onclick = () => {
            const allBtns = optsContainer.querySelectorAll('button');
            allBtns.forEach(b => b.disabled = true);

            if (idx === q.answer) {
              btn.className = "w-full text-left bg-emerald-600 text-white p-3.5 rounded-xl text-xs sm:text-sm font-bold";
              addScore(10);
            } else {
              btn.className = "w-full text-left bg-rose-600 text-white p-3.5 rounded-xl text-xs sm:text-sm font-bold";
              if (allBtns[q.answer]) {
                allBtns[q.answer].className = "w-full text-left bg-emerald-700 text-white p-3.5 rounded-xl text-xs sm:text-sm font-bold border border-emerald-500";
              }
            }
            expBox.innerText = `Explanation: ${q.explanation}`;
            expBox.classList.remove('hidden');
          };
          optsContainer.appendChild(btn);
        });
      }

      document.getElementById('prev-btn').disabled = (currentIdx === 0);
      document.getElementById('next-btn').disabled = (currentIdx === activeSet.length - 1);
    }

    function revealFlashcard() {
      const q = activeSet[currentIdx];
      const expBox = document.getElementById('explanation-box');
      expBox.innerHTML = `<strong>Answer:</strong> ${q.options[q.answer]}<br><br><strong>Details:</strong> ${q.explanation}`;
      expBox.classList.remove('hidden');
    }

    function jumpToQuestion(val) {
      currentIdx = parseInt(val, 10);
      renderCurrentQuestion();
    }

    function navQuestion(dir) {
      currentIdx += dir;
      renderCurrentQuestion();
    }

    function closeQuiz() {
      document.getElementById('quiz-container').classList.add('hidden');
    }

    function addScore(pts) {
      totalScore += pts;
      localStorage.setItem('bee_score', totalScore);
      document.getElementById('overall-score').innerText = `Score: ${totalScore} pts`;
    }
  </script>
</body>
</html>
