<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive PDF Quiz Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Main Container -->
  <div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-amber-400 mb-2">GeoQuiz Explorer 🌍</h1>
      <p class="text-slate-400 text-sm">Generated from: <i>100 Geography Facts to Know</i></p>
    </div>

    <!-- Controls / Age Selection -->
    <div class="mb-6 bg-slate-700/50 p-4 rounded-xl border border-slate-600">
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Select Player Age Group:</label>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="setAgeTier('junior')" id="btn-junior" class="py-2 px-4 rounded-lg font-bold border-2 border-indigo-500 bg-indigo-600 text-white transition-all">
          Ages 9–11 (Junior)
        </button>
        <button onclick="setAgeTier('senior')" id="btn-senior" class="py-2 px-4 rounded-lg font-bold border-2 border-slate-600 bg-slate-800 text-slate-300 transition-all">
          Ages 12–15 (Pro)
        </button>
      </div>
    </div>

    <!-- Quiz Area -->
    <div id="quiz-card" class="space-y-4">
      <div class="flex justify-between items-center text-xs text-slate-400 font-semibold">
        <span id="question-tracker">Question 1 of 3</span>
        <span id="score-tracker" class="text-amber-400 font-bold text-sm">Score: 0</span>
      </div>

      <!-- Question Text -->
      <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 min-h-[90px] flex items-center">
        <h2 id="question-text" class="text-lg font-medium text-slate-100">Loading Question...</h2>
      </div>

      <!-- Answer Buttons -->
      <div id="options-container" class="grid grid-cols-1 gap-3">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- Result Area (Hidden by Default) -->
    <div id="result-card" class="hidden text-center py-8 space-y-4">
      <div class="text-5xl">🏆</div>
      <h2 class="text-2xl font-bold text-amber-400">Quiz Completed!</h2>
      <p id="final-score" class="text-slate-300 text-lg">You scored 0 out of 0</p>
      <button onclick="restartQuiz()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-lg">
        Try Another Quiz
      </button>
    </div>

  </div>

  <script>
    // Quiz Database extracted & adapted from the provided PDF[span_2](start_span)[span_2](end_span)
    const quizData = {
      junior: [ // Ages 9-11: Direct recall & simpler prompts
        {
          question: "What is the largest island on Earth whose capital city is Nuuk?",
          options: ["Madagascar", "Greenland", "Java", "Crete"],
          answer: 1,
          factRef: "Greenland (Kalaallit Nunaat) is the largest island on Earth..." //[span_3](start_span)[span_3](end_span)
        },
        {
          question: "Which island in Indonesia is famous for its coffee and is the most populous island in the world?",
          options: ["Java", "Maui", "Hokkaido", "Sri Lanka"],
          answer: 0,
          factRef: "Java, an island in Indonesia, is the most populous island..." //[span_4](start_span)[span_4](end_span)
        },
        {
          question: "What famous Incan city in Peru was discovered by Hiram Bingham in 1911?",
          options: ["Angkor Wat", "Stonehenge", "Machu Picchu", "Tenochtitlan"],
          answer: 2,
          factRef: "Machu Picchu, an Incan city, was discovered by Hiram Bingham in 1911..." //[span_5](start_span)[span_5](end_span)
        }
      ],
      senior: [ // Ages 12-15: Multi-fact context & higher vocabulary
        {
          question: "Connected to the Atlantic Ocean by the Strait of Gibraltar, which sea receives outflow from the Black Sea via the Bosporus and Dardanelles?",
          options: ["Red Sea", "Mediterranean Sea", "Baltic Sea", "Persian Gulf"],
          answer: 1,
          factRef: "The Black Sea... flows through the Bosporus and Dardanelles into the Aegean Sea / Strait of Gibraltar connects Mediterranean..." //[span_6](start_span)[span_6](end_span)
        },
        {
          question: "Which African desert spans across parts of Botswana, Namibia, and South Africa?",
          options: ["Gobi Desert", "Atacama Desert", "Kalahari Desert", "Sahara Desert"],
          answer: 2,
          factRef: "The Kalahari Desert is located in Southern Africa..." //[span_7](start_span)[span_7](end_span)
        },
        {
          question: "Which major European river flows through capital cities such as Vienna, Budapest, and Belgrade before emptying into the Black Sea?",
          options: ["Rhine River", "Volga River", "Danube River", "Yangtze River"],
          answer: 2,
          factRef: "Danube River is the second longest river in Europe and flows through..." //[span_8](start_span)[span_8](end_span)
        }
      ]
    };

    let currentTier = 'junior';
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    function setAgeTier(tier) {
      currentTier = tier;
      document.getElementById('btn-junior').className = tier === 'junior' 
        ? "py-2 px-4 rounded-lg font-bold border-2 border-indigo-500 bg-indigo-600 text-white transition-all"
        : "py-2 px-4 rounded-lg font-bold border-2 border-slate-600 bg-slate-800 text-slate-300 transition-all";
      
      document.getElementById('btn-senior').className = tier === 'senior' 
        ? "py-2 px-4 rounded-lg font-bold border-2 border-indigo-500 bg-indigo-600 text-white transition-all"
        : "py-2 px-4 rounded-lg font-bold border-2 border-slate-600 bg-slate-800 text-slate-300 transition-all";

      restartQuiz();
    }

    function shuffleArray(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      currentQuestions = shuffleArray([...quizData[currentTier]]);
      document.getElementById('quiz-card').classList.remove('hidden');
      document.getElementById('result-card').classList.add('hidden');
      document.getElementById('score-tracker').innerText = `Score: ${score}`;
      loadQuestion();
    }

    function loadQuestion() {
      const q = currentQuestions[currentIndex];
      document.getElementById('question-tracker').innerText = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
      document.getElementById('question-text').innerText = q.question;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium py-3 px-4 rounded-xl border border-slate-600 transition-all active:scale-[0.98]";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
      });
    }

    function selectOption(index) {
      const q = currentQuestions[currentIndex];
      const buttons = document.getElementById('options-container').children;

      for (let btn of buttons) {
        btn.disabled = true;
      }

      if (index === q.answer) {
        buttons[index].className = "w-full text-left bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl border border-emerald-500";
        score += 10;
        document.getElementById('score-tracker').innerText = `Score: ${score}`;
      } else {
        buttons[index].className = "w-full text-left bg-rose-600 text-white font-bold py-3 px-4 rounded-xl border border-rose-500";
        buttons[q.answer].className = "w-full text-left bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl border border-emerald-500";
      }

      setTimeout(() => {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
          loadQuestion();
        } else {
          showResults();
        }
      }, 1200);
    }

    function showResults() {
      document.getElementById('quiz-card').classList.add('hidden');
      document.getElementById('result-card').classList.remove('hidden');
      document.getElementById('final-score').innerText = `You scored ${score} points!`;
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }

    // Initialize on load
    restartQuiz();
  </script>
</body>
</html>
