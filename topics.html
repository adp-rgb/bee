<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Bee - Knowledge Base</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-4 sm:p-6">

  <div class="max-w-6xl mx-auto space-y-6">
    <header class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg">
      <div>
        <h1 class="text-2xl font-bold text-amber-400">Academic Bee Knowledge Base 📚</h1>
        <p class="text-xs text-slate-400">Explore competition topics with key facts and definitions</p>
      </div>
      <a href="index.html" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-sm font-bold transition-all">
        ← Back to Quiz
      </a>
    </header>

    <div id="topics-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>

  <script>
    async function init() {
      try {
        const res = await fetch('topics.json');
        const data = await res.json();
        const container = document.getElementById('topics-container');
        
        let html = '';
        ['Science', 'Geography'].forEach(cat => {
          if (data[cat]) {
            data[cat].forEach(item => {
              html += `
                <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
                  <span class="text-xs font-bold text-amber-400 uppercase">${item.mode} • ${cat}</span>
                  <h3 class="text-lg font-bold text-white mt-1 mb-2">${item.name}</h3>
                  <p class="text-slate-400 text-xs">${item.definition}</p>
                </div>
              `;
            });
          }
        });
        container.innerHTML = html;
      } catch(e) {
        console.error(e);
      }
    }
    init();
  </script>
</body>
</html>
