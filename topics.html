<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good to Know Topics | Knowledge Base</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Header Navigation -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="./index.html" class="bg-amber-500 text-slate-950 font-black p-2 rounded-xl text-lg shadow-lg">🐝</a>
        <h1 class="text-lg font-bold text-slate-100">Core Topic Knowledge Hub</h1>
      </div>
      <a href="./index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3.5 py-2 rounded-xl font-semibold border border-slate-700 transition-all">
        ← Back to Quiz
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 w-full flex-1 space-y-6">

    <!-- Search Input & Topic Badges Cloud -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
      <div class="relative">
        <input type="text" id="topic-search" oninput="filterTopics()" placeholder="Search topics or facts (e.g. Acceleration, Velocity, Gravity)..." 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 outline-none focus:border-amber-500/50 transition-all">
      </div>

      <!-- Cloud Container -->
      <div id="topic-cloud" class="flex flex-wrap gap-2 max-h-60 overflow-y-auto p-1 scrollbar-thin">
        <span class="text-xs text-slate-500">Loading topics database...</span>
      </div>
    </section>

    <!-- Active Topic Detail View -->
    <section id="topic-detail-card" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6 hidden">
      
      <!-- Topic Header & Navigation Controls -->
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h2 id="topic-title" class="text-2xl sm:text-3xl font-extrabold text-slate-100">Topic Title</h2>
        <div class="flex gap-2">
          <button onclick="navigateTopic(-1)" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition-all">‹ Prev</button>
          <button onclick="navigateTopic(1)" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition-all">Next ›</button>
        </div>
      </div>

      <!-- Overview Summary Box -->
      <div class="bg-amber-500/10 border border-amber-500/20 p-4 rounded-xl">
        <p id="topic-summary" class="text-sm text-amber-200/90 leading-relaxed font-normal">
          Topic summary definition...
        </p>
      </div>

      <!-- Key Facts Bullet List -->
      <div class="space-y-3">
        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">KEY FACTS</h3>
        <ul id="topic-facts" class="space-y-2.5 text-sm text-slate-300 leading-relaxed">
        </ul>
      </div>

      <!-- Related Topics Cards -->
      <div class="pt-4 border-t border-slate-800 space-y-3">
        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">RELATED TOPICS</h3>
        <div id="related-topics" class="flex flex-wrap gap-2">
        </div>
      </div>

    </section>

  </main>

  <script>
    let topicsData = {};
    let activeKeysList = [];
    let selectedTopicKey = null;

    // Fallback data if JSON fails to load
    const DEFAULT_TOPICS = {
      "Acceleration": {
        "topic": "Acceleration",
        "summary": "Acceleration is the rate at which an object's velocity changes over time. It is a vector, meaning it has both size and direction, and it is measured in meters per second squared (m/s²).",
        "facts": [
          "Acceleration describes how quickly velocity changes, including changes in speed, direction, or both.",
          "Average acceleration can be calculated with the formula a = Δv/Δt.",
          "Instantaneous acceleration is the derivative of velocity with respect to time.",
          "Newton's Second Law connects force and acceleration: F = ma, so acceleration equals net force divided by mass (a = Fnet/m).",
          "On Earth near the surface, the acceleration due to gravity is about 9.8 m/s² downward.",
          "In uniform circular motion, centripetal acceleration is directed toward the center (ac = v²/r)."
        ],
        "related_topics": ["Velocity", "Newton's Second Law of Motion", "Kinematics"]
      }
    };

    async function loadTopics() {
      try {
        const res = await fetch('./topics.json');
        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
        const data = await res.json();
        topicsData = (data && Object.keys(data).length > 0) ? data : DEFAULT_TOPICS;
      } catch (e) {
        console.warn('Failed to load topics.json, using fallback data:', e);
        topicsData = DEFAULT_TOPICS;
      }

      renderTopicCloud();
      
      const keys = Object.keys(topicsData);
      if (keys.length > 0) {
        selectTopic(keys[0]);
      }
    }

    function matchesSearch(key, item, query) {
      if (!query) return true;
      const q = query.toLowerCase();

      if (key.toLowerCase().includes(q)) return true;
      if (item.summary && item.summary.toLowerCase().includes(q)) return true;
      if (item.facts && item.facts.some(f => f.toLowerCase().includes(q))) return true;

      return false;
    }

    function renderTopicCloud() {
      const container = document.getElementById('topic-cloud');
      const query = document.getElementById('topic-search').value.trim();
      container.innerHTML = '';

      activeKeysList = Object.keys(topicsData).filter(key => 
        matchesSearch(key, topicsData[key], query)
      );

      if (activeKeysList.length === 0) {
        container.innerHTML = '<span class="text-xs text-slate-500">No matching topics found.</span>';
        return;
      }

      activeKeysList.forEach(key => {
        const btn = document.createElement('button');
        const isSelected = key === selectedTopicKey;
        
        btn.className = isSelected 
          ? "px-3.5 py-1.5 rounded-full text-xs font-semibold bg-amber-500 text-slate-950 transition-all shadow-md shadow-amber-500/20"
          : "px-3.5 py-1.5 rounded-full text-xs font-medium bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 transition-all";
        
        btn.innerText = key;
        btn.onclick = () => selectTopic(key);
        container.appendChild(btn);
      });
    }

    function selectTopic(key) {
      if (!topicsData[key]) {
        // If related topic isn't in DB yet, create dynamic placeholder
        topicsData[key] = {
          topic: key,
          summary: `${key} is a key academic topic in competition science and geography.`,
          facts: [`Key facts and clues for ${key} are being generated from past packets.`],
          related_topics: []
        };
      }

      selectedTopicKey = key;
      renderTopicCloud();
      renderTopicDetails();
    }

    function renderTopicDetails() {
      if (!selectedTopicKey || !topicsData[selectedTopicKey]) return;

      const card = document.getElementById('topic-detail-card');
      card.classList.remove('hidden');

      const data = topicsData[selectedTopicKey];

      document.getElementById('topic-title').innerText = data.topic || selectedTopicKey;
      document.getElementById('topic-summary').innerText = data.summary || '';

      // Render Facts list
      const factsContainer = document.getElementById('topic-facts');
      factsContainer.innerHTML = (data.facts || []).map(fact => 
        `<li class="bg-slate-950 border border-slate-800 p-3.5 rounded-xl flex items-start gap-3">
          <span class="text-amber-400 font-bold">•</span>
          <span>${fact}</span>
        </li>`
      ).join('');

      // Render Related Topics buttons
      const relatedContainer = document.getElementById('related-topics');
      relatedContainer.innerHTML = (data.related_topics || []).map(rel => 
        `<button onclick="selectTopic('${rel}')" class="w-full text-left bg-slate-950 hover:bg-slate-800 border border-slate-800 p-3 rounded-xl text-xs font-semibold text-indigo-300 transition-all">
          + ${rel}
        </button>`
      ).join('');
    }

    function navigateTopic(direction) {
      if (activeKeysList.length === 0) return;
      let currentIndex = activeKeysList.indexOf(selectedTopicKey);
      if (currentIndex === -1) currentIndex = 0;
      
      let newIndex = (currentIndex + direction + activeKeysList.length) % activeKeysList.length;
      selectTopic(activeKeysList[newIndex]);
    }

    function filterTopics() {
      renderTopicCloud();
    }

    loadTopics();
  </script>
</body>
</html>
