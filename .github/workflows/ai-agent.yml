name: AI Geography & Science Bee Agent

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight UTC
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  research-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        # Updated from @v4 to @v5 (or later) for Node 24 support
        uses: actions/checkout@v5

      - name: Set up Python
        # Updated from @v5 to @v7 for Node 24 support
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Run AI Research Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py

      - name: Commit and Push Updated Knowledge Resource
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quizzes.json
          git commit -m "Auto-generated updated geography and science quizzes [skip ci]" || exit 0
          git push
